model:
  id: "Qwen/Qwen2.5-7B-Instruct"
  dtype: "bfloat16"

jlens:
  n_prompts: 1000
  max_length: 128
  n_proj: 32          # Hutchinson projections per (prompt, layer); paper quality

workspace:
  kurtosis_threshold: 0.0   # excess kurtosis; >0 = active position (paper metric)
  var_threshold: 0.05        # min J-space variance fraction for workspace label
  top_k: 10

output:
  jlens_path: "outputs/jlens.pt"
  figs_dir: "outputs/figs"
