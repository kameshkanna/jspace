[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "jspace"
version = "0.1.0"
description = "Jacobian Lens: J-space / Global Workspace replication for open LLMs"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.3.0",
    "transformers>=4.43.0",
    "accelerate>=0.31.0",
    "einops>=0.8.0",
    "numpy>=1.26.0",
    "scipy>=1.13.0",
    "tqdm>=4.66.0",
    "rich>=13.7.0",
    "pyyaml>=6.0.1",
    "matplotlib>=3.9.0",
    "seaborn>=0.13.2",
    "pandas>=2.2.0",
    "huggingface-hub>=0.24.0",
    "safetensors>=0.4.3",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "black>=24.0", "ruff>=0.5.0", "ipykernel>=6.29.0", "jupyter>=1.0.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100

[tool.black]
line-length = 100
